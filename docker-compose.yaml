services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tfu5
      POSTGRES_PASSWORD: tfu5
      POSTGRES_DB: tfu5
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfu5 -d tfu5"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment: &app-env
      DATABASE_URL: ${DATABASE_URL:-postgresql://tfu5:tfu5@db:5432/tfu5}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM_URL: redis://redis:6379/2
      REDIS_STREAM_NAME: solicitudes
      SOAP_URL: ${SOAP_URL:-http://soap:8001/?wsdl}
      SOAP_TIMEOUT: ${SOAP_TIMEOUT:-5}
      STREAM_BLOCK_MS: ${STREAM_BLOCK_MS:-5000}
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-2}
      CIRCUIT_BREAKER_FAILURES: ${CIRCUIT_BREAKER_FAILURES:-3}
      CIRCUIT_BREAKER_RESET_SECONDS: ${CIRCUIT_BREAKER_RESET_SECONDS:-30}
      REDIS_GROUP_NOTIFICACIONES: ${REDIS_GROUP_NOTIFICACIONES:-grupo_notificaciones}
      REDIS_GROUP_AUDITORIA: ${REDIS_GROUP_AUDITORIA:-grupo_auditoria}
      CACHE_TTL_LISTA: ${CACHE_TTL_LISTA:-30}
      CACHE_TTL_DETALLE: ${CACHE_TTL_DETALLE:-60}
      VALET_TTL: ${VALET_TTL:-300}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  balanceador:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on: [api]
    restart: unless-stopped

  soap:
    build: .
    command: ["python", "-m", "soap_service.server"]
    environment: *app-env
    depends_on:
      db: {condition: service_healthy}
    expose: ["8001"]
    restart: unless-stopped

  event-publisher:
    build: .
    command: ["python", "event_publisher.py"]
    environment: *app-env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  notificaciones:
    build: .
    command: ["python", "-m", "notification_service.consumer"]
    environment: *app-env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      soap: {condition: service_started}
    restart: unless-stopped

  auditoria:
    build: .
    command: ["python", "-m", "audit_service.consumer"]
    environment: *app-env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
